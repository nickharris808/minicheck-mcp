[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicheck-mcp"
version = "0.2.0"
description = "A model checker as an MCP server: let an AI agent verify a state machine instead of guessing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "model-checking", "verification", "agents", "llm-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
# minicheck is not on PyPI yet, so a bare `minicheck>=0.2.0` makes this package
# UNINSTALLABLE for anyone who has not already installed it by hand — pip resolves the
# name against PyPI and 404s. A PEP 508 direct reference resolves without an index, so
# `pip install .` and `pip install <this>@git+...` both work today for a stranger.
#
# Swap it back to a plain `minicheck>=0.2.0` when publishing to PyPI (PyPI rejects direct
# references on upload). `python build_pypi.py` does that swap and builds the artifact.
dependencies = ["minicheck @ git+https://github.com/nickharris808/minicheck@main"]

[project.urls]
Homepage = "https://github.com/nickharris808/minicheck-mcp"
Documentation = "https://nickharris808.github.io/verification-docs/"
Repository = "https://github.com/nickharris808/minicheck-mcp"
Issues = "https://github.com/nickharris808/minicheck-mcp/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
test = ["pytest>=7", "tomli; python_version < '3.11'"]

[project.scripts]
minicheck-mcp = "minicheck_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["network: reaches PyPI; skipped offline, and a skip is never a pass"]
testpaths = ["tests"]
