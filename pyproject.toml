[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicheck-mcp"
version = "0.1.0"
description = "A model checker as an MCP server: let an AI agent verify a state machine instead of guessing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "model-checking", "verification", "agents", "llm-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = ["minicheck>=0.1.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
test = ["pytest>=7"]

[project.scripts]
minicheck-mcp = "minicheck_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
